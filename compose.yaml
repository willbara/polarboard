services:
  polarboard:
    build:
      context: .
      dockerfile: Containerfile
    container_name: polarboard
    ports:
      - "8787:8787"
    volumes:
      # Everything Polarboard keeps: ./data/vault holds the first account's notes,
      # ./data/vaults/* the accounts added in the app. :Z relabels for SELinux (Fedora); harmless elsewhere.
      - ./data:/data:Z
      # Optional: keep scheduled backups somewhere else, e.g. a NAS share mounted on the host,
      # and set POLARBOARD_BACKUPS below to match.
      # - /mnt/nas/polarboard-backups:/backups:Z
      # Optional, for git push over SSH: mount a key the container can use.
      # - ~/.ssh/polarboard_ed25519:/root/.ssh/id_ed25519:ro,Z
    environment:
      # Optional server password: required to add or delete accounts. Each account
      # can also have its own password, set in Settings → General.
      POLARBOARD_PASSWORD: ""
      # Where scheduled backups go (default /data/backups). Turn them on in Settings → Sync.
      # POLARBOARD_BACKUPS: /backups
      # Wrong passwords allowed per account in 10 minutes (0 turns the limit off).
      # POLARBOARD_LOGIN_TRIES: "8"
    restart: unless-stopped
    # Here as well as in the Containerfile: Podman ignores a Containerfile HEALTHCHECK in its default image format.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
